unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-d
set -g mouse on
set -g base-index 1
unbind -T root WheelUpPane
unbind -T root WheelDownPane
set-option -g status-position top
set -g default-terminal "tmux-256color"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Workspace picker (prefix + w)
bind-key w run-shell "~/.config/tmux/scripts/workspace-picker.sh"

# Tokyo Night theme (manual palette, no plugin needed)
tokyonight_bg="#1a1b26"
tokyonight_fg="#c0caf5"
tokyonight_comment="#565f89"
tokyonight_blue="#7aa2f7"
tokyonight_cyan="#7dcfff"
tokyonight_green="#9ece6a"
tokyonight_magenta="#bb9af7"
tokyonight_orange="#ff9e64"
tokyonight_yellow="#e0af68"

set -g mode-style "fg=$tokyonight_bg,bg=$tokyonight_blue"
set -g message-style "bg=$tokyonight_comment,fg=$tokyonight_fg"
set -g message-command-style "bg=$tokyonight_comment,fg=$tokyonight_fg"
set -g pane-border-style "fg=$tokyonight_comment"
set -g pane-active-border-style "fg=$tokyonight_blue"
set -g status-style "bg=$tokyonight_bg,fg=$tokyonight_fg"
set -g status-left-style "bg=$tokyonight_bg,fg=$tokyonight_blue"
set -g status-right-style "bg=$tokyonight_bg,fg=$tokyonight_fg"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'

# Sessionx configuration
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# Sessionx configuration colors are themed by the base status-style above.
# Window status (Tokyo Night: blue active, dim inactive)
setw -g window-status-format "#{?window_active,#[fg=$tokyonight_blue],#[fg=$tokyonight_comment]} #[bold]#I#[fg=$tokyonight_comment] #W #[fg=$tokyonight_bg]"
setw -g window-status-current-format "#[fg=$tokyonight_blue]#[bg=$tokyonight_bg] #[fg=$tokyonight_bg,bg=$tokyonight_blue,bold] #I #W "

set -g status-right-length 100
set -g status-left-length 100
set -g status-left " #[fg=$tokyonight_bg,bg=$tokyonight_blue,bold]  #S "
set -g status-right " #{?window_zoomed_flag,#[fg=$tokyonight_yellow] ,}#[fg=$tokyonight_cyan]#{pane_current_command} #[fg=$tokyonight_comment]| #[fg=$tokyonight_green]%H:%M "


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

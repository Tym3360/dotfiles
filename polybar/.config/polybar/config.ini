; polybar config — catppuccin mocha + AeroSpace/i3 colors
; X11/i3 status bar (replaces waybar, which Ubuntu 24.04 ships Wayland-only)

[colors]
bg       = #1e1e2e
bg-alt   = #181825
fg       = #cdd6f4
fg-dim   = #6c7086
accent   = #00e5ff
inactive = #494d64
urgent   = #f38ba8
warning  = #f9e2af

[bar/main]
monitor  = ${env:MONITOR:}
width    = 100%e
height   = 28
offset-x = 0
offset-y = 0
radius   = 0

background = ${colors.bg}
foreground = ${colors.fg}

font-0 = "Hack Nerd Font:style=Regular:size=10;2"
font-1 = "Hack Nerd Font:style=Bold:size=10;2"

padding-left  = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 2

modules-left   = i3 xwindow
modules-center = clock
modules-right  = tray pulseaudio network battery

cursor-click = pointer
locale = en_US.UTF-8

; bottom bar line for crisp look
line-size = 0

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-background = ${colors.urgent}

; workspace labels — persistent workspaces 1..9 (like aerospace)
label-focused = %name%
label-focused-underline = ${colors.accent}
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.bg-alt}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %name%!
label-urgent-foreground = ${colors.urgent}
label-urgent-background = ${colors.bg-alt}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.fg}

[module/clock]
type = internal/date
interval = 30
time = %H:%M
date-alt = %a %d %b
time-alt = %H:%M:%S
format = <label>
format-padding = 2
label = 󰅐 %time%  |  %date-alt%

[module/tray]
type = internal/tray
format-padding = 4
tray-spacing = 6px
tray-size = 60%

[module/pulseaudio]
type = internal/pulseaudio
sink = auto
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 2
format-muted = <label-muted>
format-muted-padding = 2
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.fg-dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-connected-padding = 2
format-disconnected = <label-disconnected>
format-disconnected-padding = 2
label-connected = 󰖩 %essid% (%signal%%)
label-disconnected = 󰖪 offline
label-disconnected-foreground = ${colors.urgent}

[module/battery]
type = internal/battery
battery = ${env:PB_BATTERY:BAT0}
adapter = ${env:PB_ADAPTER:AC}
full-at = 98
interval = 60

format-charging = <animation-charging> <label-charging>
format-charging-padding = 2
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 2
format-full = <label-full>
format-full-padding = 2

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.fg}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂂
animation-charging-framerate = 750

[settings]
screenchange-reload = true
pseudo-transparency = true
